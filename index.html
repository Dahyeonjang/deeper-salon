<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>디퍼언브랜딩살롱 보석함</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F4F3F8;color:#1A1625}
.hero{background:#3B2D6E;padding:2rem;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,0.05)}
.hero::after{content:'';position:absolute;right:60px;bottom:-60px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,0.04)}
.hero-label{font-size:11px;letter-spacing:1.5px;color:#B8A9E0;margin-bottom:10px;text-transform:uppercase}
.hero-title{font-size:24px;font-weight:500;color:#fff;margin-bottom:8px;position:relative;z-index:1}
.hero-sub{font-size:13px;color:#C4B8E8;line-height:1.7;position:relative;z-index:1}
.body{max-width:640px;margin:0 auto;padding:1.5rem 1.25rem 3rem}
.tab-bar{display:flex;gap:8px;margin-bottom:1.75rem}
.tab{padding:8px 20px;border-radius:20px;border:1.5px solid #C9C0E8;background:#fff;cursor:pointer;font-size:14px;color:#6B5CA0;transition:all 0.15s}
.tab.active{background:#3B2D6E;color:#fff;border-color:#3B2D6E}
.tab:hover:not(.active){background:#EEE9FA}
.view{display:none}.view.active{display:block}
.form-card{background:#fff;border-radius:12px;padding:1.5rem;margin-bottom:1rem;border:1px solid #E2DCF4}
.form-label{font-size:11px;color:#8879B8;letter-spacing:0.6px;text-transform:uppercase;margin-bottom:8px;display:block;font-weight:500}
.form-row{margin-bottom:1.25rem}
.form-row:last-child{margin-bottom:0}
select,textarea,input[type=text]{width:100%;font-size:14px;background:#FAF9FD;border:1.5px solid #D6CEF0;border-radius:8px;color:#1A1625;padding:10px 12px;transition:border-color 0.15s;font-family:inherit}
select{cursor:pointer}
textarea{resize:vertical;min-height:90px}
select:focus,textarea:focus,input:focus{outline:none;border-color:#7B68C8;background:#fff}
.tag-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag-btn{padding:5px 13px;border-radius:20px;border:1.5px solid #D6CEF0;background:#FAF9FD;cursor:pointer;font-size:12px;color:#6B5CA0;transition:all 0.15s;display:flex;align-items:center;gap:5px}
.tag-btn:hover{border-color:#A899D4;background:#EEE9FA}
.tag-btn.selected{background:#3B2D6E;color:#fff;border-color:#3B2D6E}
.tag-btn .del{font-size:10px;opacity:0.45;cursor:pointer}
.tag-add-row{display:flex;gap:6px}
.tag-add-row input{flex:1}
.tag-add-btn{padding:9px 14px;border-radius:8px;border:1.5px solid #D6CEF0;background:#FAF9FD;cursor:pointer;font-size:13px;color:#6B5CA0;white-space:nowrap}
.author-row{display:flex;gap:8px}
.author-row select{flex:1}
.submit-btn{width:100%;padding:12px;border-radius:8px;border:none;background:#3B2D6E;color:#fff;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.15s}
.submit-btn:disabled{opacity:0.6;cursor:not-allowed}
.refresh-row{display:flex;justify-content:flex-end;margin-bottom:1rem}
.refresh-btn{padding:6px 14px;border-radius:20px;border:1.5px solid #C9C0E8;background:#fff;cursor:pointer;font-size:12px;color:#6B5CA0}
.member-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:1.5rem}
.member-btn{background:#fff;border:1.5px solid #E2DCF4;border-radius:12px;padding:1rem;cursor:pointer;text-align:left;transition:all 0.15s}
.member-btn:hover{border-color:#A899D4;background:#F7F5FD}
.member-btn.active{border-color:#3B2D6E;background:#F7F5FD;border-width:2px}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:15px;margin-bottom:10px}
.member-name{font-weight:500;font-size:14px;margin-bottom:4px}
.gem-type-badge{display:inline-block;font-size:11px;font-weight:500;color:#5E4FA0;background:#EEE9FA;border:1px solid #D6CEF0;border-radius:10px;padding:2px 9px;margin-bottom:6px}
.gem-type-badge.pending{color:#A89CC4;background:#F4F3F8;border-color:#E2DCF4}
.gem-count{font-size:11px;color:#8879B8;display:block}
.gem-full-badge{display:inline-block;font-size:10px;font-weight:600;color:#fff;background:linear-gradient(135deg,#8C7BD4,#5E4FA0);border-radius:8px;padding:2px 7px;margin-left:6px;animation:sparkle 1.5s ease-in-out infinite}
@keyframes sparkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.85;transform:scale(1.06)}}
.gem-story{background:#F7F5FD;border:1px solid #E2DCF4;border-radius:10px;padding:14px 16px;margin-bottom:1.25rem;font-size:13px;line-height:1.7;color:#5E4FA0}
.gem-story-title{font-size:12px;font-weight:600;color:#3B2D6E;margin-bottom:6px}
.cards-wrap{background:#fff;border-radius:12px;padding:1.5rem;border:1px solid #E2DCF4}
.cards-header{display:flex;align-items:center;gap:10px;margin-bottom:1.25rem;padding-bottom:1rem;border-bottom:1px solid #EEE9FA;flex-wrap:wrap}
.cards-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500}
.cards-name{font-size:16px;font-weight:500}
.cards-count{font-size:12px;color:#8879B8;margin-left:auto}
.card-item{padding:14px 16px;border-radius:8px;border:1px solid #E2DCF4;margin-bottom:8px;background:#FAF9FD;transition:border-color 0.15s}
.card-item:hover{border-color:#A899D4}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.card-tag{padding:2px 9px;border-radius:10px;font-size:11px;background:#EEE9FA;color:#5E4FA0;border:1px solid #D6CEF0}
.card-content{font-size:14px;line-height:1.7;margin-bottom:8px}
.card-footer{display:flex;align-items:center;justify-content:space-between}
.card-meta{font-size:11px;color:#9B8EC4;display:flex;gap:4px}
.card-meta span+span::before{content:'·';margin-right:4px;opacity:0.5}
.card-actions{display:flex;gap:6px;opacity:0;transition:opacity 0.15s}
.card-item:hover .card-actions{opacity:1}
.card-act-btn{padding:3px 10px;border-radius:6px;border:1px solid #D6CEF0;background:#fff;font-size:11px;cursor:pointer;color:#6B5CA0}
.card-act-btn.del{color:#C0556A;border-color:#EAC8D0}
.edit-area textarea{font-size:14px;min-height:70px;margin:8px 0}
.edit-tag-grid{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.edit-btns{display:flex;gap:6px}
.edit-save{padding:6px 14px;border-radius:6px;border:none;background:#3B2D6E;color:#fff;font-size:12px;cursor:pointer}
.edit-cancel{padding:6px 12px;border-radius:6px;border:1.5px solid #D6CEF0;background:#FAF9FD;color:#6B5CA0;font-size:12px;cursor:pointer}
.empty-state{padding:3rem 0;text-align:center;color:#9B8EC4;font-size:13px;line-height:2.2}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#3B2D6E;color:#fff;padding:9px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-label">DEEPER UNBRANDING SALON</div>
  <div class="hero-title">💎 디퍼언브랜딩살롱 보석함</div>
  <div class="hero-sub">당신 안에 어떤 보석이 숨어있을까요?<br>누구에게나 자신만의 원석이 있어요.<br>서로의 시선으로 함께 발굴하고, 세공하며,<br>진짜 보석으로 만들어가는 시간</div>
</div>

<div class="body">
  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('record',event)">기록하기</button>
    <button class="tab" onclick="switchTab('view',event)">보석 모아보기</button>
  </div>
  <div id="view-record" class="view active">
    <div class="form-card">
      <div class="form-row">
        <label class="form-label">멤버</label>
        <select id="target-member"><option value="">누구의 원석을 기록할까요?</option></select>
      </div>
      <div class="form-row">
        <label class="form-label">키워드 <span style="text-transform:none;letter-spacing:0;font-size:11px;color:#9B8EC4;font-weight:400">(선택 · 직접 추가 가능)</span></label>
        <div class="tag-grid" id="tag-grid"></div>
        <div class="tag-add-row">
          <input type="text" id="new-tag-input" placeholder="직접 추가" onkeydown="if(event.key==='Enter')addTag()">
          <button class="tag-add-btn" onclick="addTag()">+ 추가</button>
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">발견한 장점 · 재능</label>
        <textarea id="card-content" placeholder="어떤 장점이나 재능을 발견했나요?"></textarea>
      </div>
      <div class="form-row">
        <label class="form-label">기록한 사람 <span style="text-transform:none;letter-spacing:0;font-size:11px;color:#9B8EC4;font-weight:400">(선택)</span></label>
        <div class="author-row">
          <select id="author-select"><option value="">멤버 선택</option></select>
          <input type="text" id="author-text" placeholder="이름 직접 입력" style="display:none;flex:1;max-width:160px">
        </div>
      </div>
      <div class="form-row">
        <button class="submit-btn" id="submit-btn" onclick="submitCard()">보석 저장하기</button>
      </div>
    </div>
  </div>
  <div id="view-view" class="view">
    <div class="refresh-row">
      <button class="refresh-btn" onclick="loadCards()">↻ 새로고침</button>
    </div>
    <div class="member-grid" id="member-grid"></div>
    <div id="cards-wrap-outer" style="display:none">
      <div class="cards-wrap"><div id="cards-section"></div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
(function(){
  "use strict";

  var firebaseConfig = {
    apiKey: "AIzaSyCjjZ-HojvC_UlCt1S0FiF_kAH6ycM59e0",
    authDomain: "deeper-salon-gems.firebaseapp.com",
    projectId: "deeper-salon-gems",
    storageBucket: "deeper-salon-gems.firebasestorage.app",
    messagingSenderId: "1078124451834",
    appId: "1:1078124451834:web:183e20ed44b40c76b27643"
  };

  if (typeof firebase === "undefined") {
    document.getElementById('cards-section').innerHTML =
      '<div class="empty-state">Firebase 라이브러리를 불러오지 못했어요.<br>인터넷 연결을 확인하고 새로고침 해주세요.</div>';
    return;
  }

  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();

  var MEMBERS = ["단무지","솔담","스윗워러","야간비행","퍼핀","햇살","헤더"];
  var BG = ["#EDE8F5","#E1F0EC","#F5EBE6","#EFF0F5","#E6EEF7","#EBF2E0","#F0ECF8"];
  var TC = ["#5B4E8C","#2E6E58","#8C4A2E","#3D4470","#2C5A8C","#3E6020","#5E3A8C"];
  var DEFAULT_TAGS = ["공감 능력","아이디어","창의성","분위기 메이커"];

  var GEM_TYPES = {
    "오팔": {emoji:"🌈", keywords:["창의성","엉뚱발랄","자기통찰","공감 능력","아이디어","유머 감각","다양함","호기심"], story:"오팔은 보는 각도에 따라 다른 빛이 나오는 보석이에요. 겉으로는 수수해 보이다가 빛이 닿는 순간 핑크, 블루, 골드가 번쩍이죠. 예측 불가능하게 아름다운, 한 마디로 규정이 안 되는 보석이에요."},
    "사파이어": {emoji:"💙", keywords:["분석력","신뢰감","세심한 배려","가치관","차분함","객관적","신중함","책임감"], story:"사파이어는 감정에 흔들리지 않는 깊고 투명한 파란색이에요. 화려하게 반짝이기보다 보는 사람이 신뢰를 느끼게 만드는, 곁에 있으면 안심이 되는 보석이에요."},
    "시트린": {emoji:"☀️", keywords:["압도적 적극성","젊은 에너지","활용력","친화력","긍정","열정","추진력"], story:"시트린은 햇살을 품은 것 같은 따뜻하고 밝은 에너지를 가진 수정이에요. '상인의 돌'이라는 별명처럼, 아이디어를 현실로 만들고 주변의 온도를 올리는 보석이에요."},
    "루비": {emoji:"🔴", keywords:["불도저 실행력","세심함","추진력","창의성","리더십","열정","불꽃"], story:"루비는 보석 중에서 가장 강렬한 불꽃의 에너지를 가졌어요. 빛을 받아서 반짝이는 게 아니라 스스로 빛을 내는, '전사의 돌'이라 불리는 보석이에요."},
    "문스톤": {emoji:"🌙", keywords:["삶의 내공","필력","아낌없는 나눔","달관","깊이","경청","공감"], story:"문스톤은 달빛을 품은 보석이에요. 직접 빛을 내뿜는 게 아니라 내면에서 은은하게 흘러나오는 빛이 특징이라, 밤이 깊어야 제대로 빛나는 '여행자의 보석'이에요."},
    "다이아몬드": {emoji:"💎", keywords:["지성","공감형 리더십","기획력","포용","문제 해결","통찰력","리더십"], story:"다이아몬드는 엄청난 압력과 시간을 견뎌서 만들어지는 보석이에요. 단단해지는 과정을 통과한 사람만이 가질 수 있는 빛이고, 빛을 받으면 자기 빛으로 바꿔서 주변을 밝히는 보석이에요."},
    "옐로 다이아몬드": {emoji:"💛", keywords:["따뜻한 에너지","1초 실행력","감사하는 삶","도전 정신","밝음","긍정","유쾌함"], story:"옐로 다이아몬드는 다이아몬드의 단단함에 태양의 따뜻함과 생명력까지 품은 보석이에요. 차갑게 빛나는 게 아니라 온기와 빛을 동시에 내뿜는, '태양의 보석'이에요."}
  };

  /* 멤버별 보석 타입 고정 배정 — 자동 매칭 대신 확정값 사용 */
  var MEMBER_GEM = {
    "단무지": "오팔",
    "솔담": "루비",
    "스윗워러": "시트린",
    "야간비행": "문스톤",
    "퍼핀": "다이아몬드",
    "햇살": "옐로 다이아몬드",
    "헤더": "사파이어"
  };

  function getGemType(memberCards, memberName){
    var fixed = MEMBER_GEM[memberName];
    if (fixed && GEM_TYPES[fixed]) {
      return {name: fixed, emoji: GEM_TYPES[fixed].emoji};
    }
    if (memberCards.length === 0) return null;
    return null;
  }

  var selTags = [], selMember = null, cards = [], tags = DEFAULT_TAGS.slice();

  var sm = document.getElementById('target-member');
  var sa = document.getElementById('author-select');
  MEMBERS.forEach(function(m){
    sm.innerHTML += '<option value="'+m+'">'+m+'</option>';
    sa.innerHTML += '<option value="'+m+'">'+m+'</option>';
  });
  sa.innerHTML += '<option value="직접입력">직접 입력</option>';
  sa.addEventListener('change', function(){
    document.getElementById('author-text').style.display = this.value === '직접입력' ? 'inline-block' : 'none';
  });

  function renderTags(){
    var g = document.getElementById('tag-grid'); g.innerHTML = '';
    tags.forEach(function(t){
      var b = document.createElement('button');
      b.className = 'tag-btn' + (selTags.indexOf(t) !== -1 ? ' selected' : '');
      var del = document.createElement('span');
      del.className = 'del'; del.textContent = '✕';
      del.onclick = function(e){ e.stopPropagation(); removeTag(t); };
      b.textContent = t;
      b.appendChild(del);
      b.onclick = function(e){ if (e.target !== del) toggleTag(t, b); };
      g.appendChild(b);
    });
  }

  function addTag(){
    var i = document.getElementById('new-tag-input');
    var v = i.value.trim();
    if (!v) return;
    if (tags.indexOf(v) !== -1) { showToast('이미 있는 키워드예요'); return; }
    tags.push(v); i.value=''; renderTags();
  }

  function removeTag(tag){
    tags = tags.filter(function(t){ return t !== tag; });
    selTags = selTags.filter(function(t){ return t !== tag; });
    renderTags();
  }

  function toggleTag(tag, btn){
    if (selTags.indexOf(tag) !== -1) { selTags = selTags.filter(function(t){ return t !== tag; }); btn.classList.remove('selected'); }
    else { selTags.push(tag); btn.classList.add('selected'); }
  }

  function submitCard(){
    var target = document.getElementById('target-member').value;
    var content = document.getElementById('card-content').value.trim();
    if (!target) { showToast('멤버를 선택해주세요'); return; }
    if (!content) { showToast('내용을 입력해주세요'); return; }
    var asel = document.getElementById('author-select').value;
    var atxt = document.getElementById('author-text').value.trim();
    var author = asel === '직접입력' ? atxt : asel;
    var btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = '저장 중...';
    db.collection('gems').add({
      target: target, content: content, tags: selTags.slice(),
      author: author || '', date: new Date().toLocaleDateString('ko-KR'), createdAt: Date.now()
    }).then(function(){
      document.getElementById('target-member').value = '';
      document.getElementById('card-content').value = '';
      document.getElementById('author-select').value = '';
      document.getElementById('author-text').style.display = 'none';
      selTags = []; renderTags();
      return loadCards();
    }).then(function(){
      showToast('보석 하나 더 💎');
    }).catch(function(e){
      showToast('저장 실패. 다시 시도해주세요');
      console.error(e);
    }).finally(function(){
      btn.disabled = false; btn.textContent = '보석 저장하기';
    });
  }

  function loadCards(){
    return db.collection('gems').orderBy('createdAt','asc').get().then(function(snap){
      cards = snap.docs.map(function(d){ var data = d.data(); data.id = d.id; return data; });
      renderMemberGrid();
    }).catch(function(e){ console.error(e); });
  }

  function renderMemberGrid(){
    var g = document.getElementById('member-grid'); g.innerHTML = '';
    MEMBERS.forEach(function(m, i){
      var mc = cards.filter(function(c){ return c.target === m; });
      var gem = getGemType(mc, m);
      var gemHtml = gem ? '<div class="gem-type-badge">'+gem.emoji+' '+gem.name+'</div>' : '<div class="gem-type-badge pending">아직 원석</div>';
      var fullBadge = mc.length >= 10 ? '<span class="gem-full-badge">✨ 가득!</span>' : '';
      var b = document.createElement('button');
      b.className = 'member-btn' + (selMember === m ? ' active' : '');
      b.innerHTML = '<div class="avatar" style="background:'+BG[i]+';color:'+TC[i]+'">'+m[0]+'</div><div class="member-name">'+m+'</div>'+gemHtml+'<span class="gem-count">💎 '+mc.length+'개'+fullBadge+'</span>';
      b.onclick = function(){ selMember = m; document.getElementById('cards-wrap-outer').style.display = 'block'; renderMemberGrid(); };
      g.appendChild(b);
    });
    if (selMember) renderCards(selMember);
  }

  function renderCards(name){
    var i = MEMBERS.indexOf(name);
    var mc = cards.filter(function(c){ return c.target === name; });
    var gem = getGemType(mc, name);
    var gemHtml = gem ? '<span class="gem-type-badge">'+gem.emoji+' '+gem.name+'</span>' : '';
    var storyHtml = gem && GEM_TYPES[gem.name] ? '<div class="gem-story"><div class="gem-story-title">'+gem.emoji+' '+gem.name+' 이야기</div>'+GEM_TYPES[gem.name].story+'</div>' : '';
    var html = storyHtml + '<div class="cards-header"><div class="cards-avatar" style="background:'+BG[i]+';color:'+TC[i]+'">'+name[0]+'</div><span class="cards-name">'+name+'</span>'+gemHtml+'<span class="cards-count">💎 '+mc.length+'개</span></div>';
    if (!mc.length) {
      html += '<div class="empty-state">아직 기록된 보석이 없어요<br>첫 번째 보석을 남겨주세요</div>';
    } else {
      mc.slice().reverse().forEach(function(c){
        var tHtml = (c.tags && c.tags.length) ? '<div class="card-tags">' + c.tags.map(function(t){ return '<span class="card-tag">'+t+'</span>'; }).join('') + '</div>' : '';
        var meta = [c.author, c.date].filter(Boolean).map(function(m){ return '<span>'+m+'</span>'; }).join('');
        html += '<div class="card-item" id="card-'+c.id+'">'+tHtml+'<div class="card-content">'+c.content+'</div><div class="card-footer"><div class="card-meta">'+meta+'</div><div class="card-actions"><button class="card-act-btn" onclick="window.__startEdit(\''+c.id+'\')">수정</button><button class="card-act-btn del" onclick="window.__deleteCard(\''+c.id+'\')">삭제</button></div></div></div>';
      });
    }
    document.getElementById('cards-section').innerHTML = html;
  }

  function deleteCard(id){
    if (!confirm('이 보석을 삭제할까요?')) return;
    db.collection('gems').doc(id).delete().then(function(){
      cards = cards.filter(function(c){ return c.id !== id; });
      renderMemberGrid();
      showToast('삭제했어요');
    });
  }

  function startEdit(id){
    var card = cards.filter(function(c){ return c.id === id; })[0];
    if (!card) return;
    var el = document.getElementById('card-' + id);
    var tagBtns = tags.map(function(t){
      var sel = card.tags && card.tags.indexOf(t) !== -1;
      return '<button class="tag-btn'+(sel?' selected':'')+'" onclick="window.__toggleEditTag(this,\''+t.replace(/'/g,"\\'")+'\',\''+id+'\')">'+t+'</button>';
    }).join('');
    el.innerHTML = '<div class="edit-area"><div class="edit-tag-grid">'+tagBtns+'</div><textarea id="edit-content-'+id+'">'+card.content+'</textarea><div class="edit-btns"><button class="edit-save" onclick="window.__saveEdit(\''+id+'\')">저장</button><button class="edit-cancel" onclick="window.__cancelEdit(\''+card.target+'\')">취소</button></div></div>';
    el._editTags = card.tags ? card.tags.slice() : [];
  }

  function toggleEditTag(btn, tag, id){
    var el = document.getElementById('card-' + id);
    if (!el._editTags) el._editTags = [];
    if (el._editTags.indexOf(tag) !== -1) { el._editTags = el._editTags.filter(function(t){ return t !== tag; }); btn.classList.remove('selected'); }
    else { el._editTags.push(tag); btn.classList.add('selected'); }
  }

  function saveEdit(id){
    var el = document.getElementById('card-' + id);
    var content = document.getElementById('edit-content-' + id).value.trim();
    if (!content) { showToast('내용을 입력해주세요'); return; }
    var editTags = el._editTags || [];
    db.collection('gems').doc(id).update({content: content, tags: editTags}).then(function(){
      var card = cards.filter(function(c){ return c.id === id; })[0];
      card.content = content; card.tags = editTags;
      renderMemberGrid();
      showToast('수정했어요 ✓');
    });
  }

  function switchTab(tab, e){
    document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
    document.querySelectorAll('.view').forEach(function(v){ v.classList.remove('active'); });
    e.target.closest('.tab').classList.add('active');
    document.getElementById('view-' + tab).classList.add('active');
    if (tab === 'view') loadCards();
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2000);
  }

  // expose to global for inline onclick handlers
  window.addTag = addTag;
  window.submitCard = submitCard;
  window.loadCards = loadCards;
  window.switchTab = switchTab;
  window.__startEdit = startEdit;
  window.__deleteCard = deleteCard;
  window.__toggleEditTag = toggleEditTag;
  window.__saveEdit = saveEdit;
  window.__cancelEdit = function(target){ renderCards(target); };

  renderTags();
  loadCards();

})();
</script>
</body>
</html>
